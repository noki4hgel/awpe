name: Awpe
main: practice\Core
version: 1.6.0
api: 5.0.0
load: POSTWORLD
author: noki7ngel
description: AWPE Practice core (lobby, FFA, scoreboard, bossbar, nametags)

permissions:
  awpe.command.spawn:
    default: true
    description: Return to the lobby with /spawn
  awpe.command.rekit:
    default: true
    description: Get the arena kit again with /rekit
  awpe.command.duel:
    default: true
    description: Challenge players and queue for duels with /duel
  awpe.command.kbdata:
    default: op
    description: Read and change a mode's knockback with /kbdata
  awpe.command.rank:
    default: op
    description: Read and assign player ranks with /rank
  awpe.bypass.chat:
    default: op
    description: Skip the chat cooldown and the repeat check
  awpe.command.ban:
    default: op
    description: Ban players with /ban
  awpe.command.mute:
    default: op
    description: Mute players with /mute
  awpe.command.kick:
    default: op
    description: Kick players with /kick
  awpe.command.unban:
    default: op
    description: Lift bans with /unban
  awpe.command.unmute:
    default: op
    description: Lift mutes with /unmute
  awpe.command.history:
    default: op
    description: Read punishment history with /history
  awpe.punish.notify:
    default: op
    description: See every punishment as it is handed out, silent ones included
