  kb-show: "§f{mode} §8| §7V §f{vertical} §8| §7H §f{horizontal} §8| §7delay §f{delay} §8({source}, {players} playing)"
  kb-updated: "§a{mode}§7: V §f{vertical} §7/ H §f{horizontal} §7/ delay §f{delay}§7. Applied to {players} player(s)."
  kb-reset: "§7{mode} restored from config: V §f{vertical} §7/ H §f{horizontal} §7/ delay §f{delay}§7."
  kb-unknown-mode: "§cUnknown mode §f{mode}§c. Available: §f{modes}"
  kb-invalid-number: "§f{value} §cis not a valid number."
  kb-out-of-range: "§cOut of range §8(push 0-{max_push}, delay 0-{max_delay})§c."
  # /rank
