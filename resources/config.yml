# ------------------------------------------------------------------
#  AWPE Practice — main configuration
#
#  Placeholders usable in every text field below:
#    {player} {online} {max_online} {kills} {deaths} {ping} {device}
#    {health} {max_health} {arena} {arena_display} {arena_players}
#    {distance} {killer} {victim}
# ------------------------------------------------------------------

# How often (in ticks) the scoreboard / bossbar / nametag are refreshed.
update-interval: 20

server:
  # Practice servers have no use for the food bar; cancelling exhaustion keeps
  # it permanently full everywhere, arenas included.
  disable-hunger: true

storage:
  # leveldb (embedded database, recommended) or json (plain file).
  # An unusable LevelDB store falls back to JSON instead of blocking startup.
  provider: leveldb

potions:
  # Vanilla measures a splash from the victim's EYES and loses potency from the
  # moment of impact, so a pot at your own feet heals barely 60%. Everything
  # within full-effect-range gets the whole effect instead, which is the pot
  # behaviour practice players expect.
  full-effect-range: 1.75
  # Blocks the splash reaches at all.
  range: 4.0
  gravity: 0.065
  drag: 0.01
  # Visual size of the thrown bottle.
  scale: 0.4

combat:
  # Seconds a player stays "in combat" after dealing or taking a hit.
  tag-duration: 10
  # Refuse every command while a player is in combat (combat log protection).
  block-commands: true
  # Fall damage is normally off on a practice server.
  disable-fall-damage: true
  # Vanilla charges 5 fall damage when an ender pearl lands. This switch is
  # separate so real falls can stay lethal while pearls do not hurt.
  disable-ender-pearl-damage: true
  # Cosmetic lightning where a player dies on FFA. Viewers can still turn it
  # off for themselves in the settings menu.
  lightning-on-kill: true
  # Banner across the killer's screen naming who he just took down. Nobody else
  # sees it - the arena already gets the kill feed in chat. Times are in ticks.
  kill-title:
    enabled: true
    fade-in: 3
    stay: 20
    fade-out: 8

cooldowns:
  # Item name => cooldown in seconds. 0 disables one.
  items:
    ender_pearl: 16
  # Show the longest running cooldown on the experience bar: the level is the
  # seconds left and the bar drains as it runs out.
  xp-bar:
    enabled: true
    # Ticks between redraws. 1 keeps the bar smooth; the work per player is a
    # single comparison, so there is little reason to raise it.
    update-interval: 1

chat:
  # Seconds a player must wait between messages. 0 disables the wait.
  cooldown: 3
  # Refuse a message identical to the player's previous one (case and spacing
  # are ignored, so "HI" after "hi" is still a repeat).
  block-repeats: true
  # Permission that skips both checks. Granted through a rank, not hard-coded.
  bypass-permission: awpe.bypass.chat

punishments:
  # Used when a command leaves the duration out, e.g. "/ban Steve cheating".
  # Anything staff can type works here: 30m, 12h, 7d, 2w, 1mo, 1y, or perm.
  default-duration:
    ban: 7d
    mute: 1h
  # Shown on the ban screen so a player knows where to appeal.
  appeal: "discord.gg/awpe"
  # PHP date() format for {created} and {expires}.
  date-format: "d.m.Y H:i"
  # Refuse a new account on a device that already carries an active ban.
  # Matched by DeviceId only: IP addresses are shared too often (mobile
  # networks, households, school Wi-Fi) and would ban innocent players.
  device-bans: true
  history-page-size: 8
  # Labels used when a duration is shown: "6d 23h".
  units:
    year: "y"
    week: "w"
    day: "d"
    hour: "h"
    minute: "m"
    second: "s"
  words:
    permanent: "permanent"
    never: "never"
    console: "Console"
    no-reason: "no reason given"
  # {type} - the noun, {action} - what was done.
  types:
    ban: "ban"
    mute: "mute"
    kick: "kick"
  actions:
    ban: "banned"
    mute: "muted"
    kick: "kicked"
  # Disconnect screens. Same placeholders as the punishment messages.
  screens:
    ban: |-
      §c§lYou are banned from AWPE

      §7Reason: §f{reason}
      §7Duration: §f{duration}
      §7Expires: §f{expires}
      §7Ban ID: §f#{id}

      §7Appeal at §b{appeal}
    device: |-
      §c§lThis device is banned

      §7An account played on this device is banned §8(#{id})§7.
      §7Expires: §f{expires}

      §7Appeal at §b{appeal}
    kick: |-
      §c§lYou were kicked

      §7Reason: §f{reason}
      §7By: §f{issuer}

messages:
  join: "§a[+] §f{player}"
  quit: "§4[-] §f{player}"
  # Shown above the hotbar to the player who got hit.
  hit-taken: "§f{player}: §e{distance}"
  # Shown above the hotbar to the player who landed the hit.
  hit-dealt: "§fDistance: §e{distance}"
  ffa-join: "§7You joined §f{arena_display}§7."
  ffa-leave: "§7You left the arena."
  # {victim_pots} / {killer_pots} are the healing splash potions each side had left.
