# ------------------------------------------------------------------
#  AWPE Practice — main configuration
#
#  Placeholders usable in every text field below:
#    {player} {online} {max_online} {kills} {deaths} {ping} {device}
#    {health} {max_health} {arena} {arena_display} {arena_players}
#    {distance} {killer} {victim}
# ------------------------------------------------------------------

# How often (in ticks) the scoreboard / bossbar / nametag are refreshed.
update-interval: 20

server:
  # Practice servers have no use for the food bar; cancelling exhaustion keeps
  # it permanently full everywhere, arenas included.
  disable-hunger: true

storage:
  # leveldb (embedded database, recommended) or json (plain file).
  # An unusable LevelDB store falls back to JSON instead of blocking startup.
  provider: leveldb

potions:
  # Vanilla measures a splash from the victim's EYES and loses potency from the
  # moment of impact, so a pot at your own feet heals barely 60%. Everything
  # within full-effect-range gets the whole effect instead, which is the pot
  # behaviour practice players expect.
  full-effect-range: 1.75
  # Blocks the splash reaches at all.
  range: 4.0
  gravity: 0.065
  drag: 0.01
  # Visual size of the thrown bottle.
  scale: 0.4

combat:
  # Seconds a player stays "in combat" after dealing or taking a hit.
  tag-duration: 10
  # Refuse every command while a player is in combat (combat log protection).
  block-commands: true
  # Fall damage is normally off on a practice server.
  disable-fall-damage: true
  # Vanilla charges 5 fall damage when an ender pearl lands. This switch is
  # separate so real falls can stay lethal while pearls do not hurt.
  disable-ender-pearl-damage: true
  # Cosmetic lightning where a player dies on FFA. Viewers can still turn it
  # off for themselves in the settings menu.
  lightning-on-kill: true

cooldowns:
  # Item name => cooldown in seconds. 0 disables one.
  items:
    ender_pearl: 16

messages:
  join: "§a[+] §f{player}"
  quit: "§4[-] §f{player}"
  # Shown above the hotbar to the player who got hit.
  hit-taken: "§f{player}: §e{distance}"
  # Shown above the hotbar to the player who landed the hit.
  hit-dealt: "§fDistance: §e{distance}"
  ffa-join: "§7You joined §f{arena_display}§7."
  ffa-leave: "§7You left the arena."
  # {victim_pots} / {killer_pots} are the healing splash potions each side had left.
  ffa-death: "§c{victim} §8[§b{victim_pots}§8] §7killed by §f{killer} §8[§b{killer_pots}§8]"
  # Used by arenas that have no pot item configured (Fist, for example).
  ffa-death-nopots: "§c{victim} §7killed by §f{killer}§7."
  ffa-death-generic: "§c{victim} §7died."
  combat-blocked: "§cYou cannot use commands in combat §7({seconds}s)§c."
  cooldown-active: "§c{item} §7is on cooldown §8- §c{seconds}s"
  players-only: "§cThis command can only be used in game."
  already-in-lobby: "§7You are already in the lobby."
  spawn-teleported: "§7Welcome back to the lobby."
  rekit-done: "§7Kit restored."
  rekit-unavailable: "§cYou can only do that inside an arena."
  # /kbdata - {source} is "config" or "runtime" (changed live and remembered).
  kb-list-header: "§7Knockback per mode:"
  kb-usage: "§7Usage: §f/kbdata <mode> <vertical> <horizontal> <delay>§7, or §f/kbdata <mode> reset"
  kb-show: "§f{mode} §8| §7V §f{vertical} §8| §7H §f{horizontal} §8| §7delay §f{delay} §8({source}, {players} playing)"
  kb-updated: "§a{mode}§7: V §f{vertical} §7/ H §f{horizontal} §7/ delay §f{delay}§7. Applied to {players} player(s)."
  kb-reset: "§7{mode} restored from config: V §f{vertical} §7/ H §f{horizontal} §7/ delay §f{delay}§7."
  kb-unknown-mode: "§cUnknown mode §f{mode}§c. Available: §f{modes}"
  kb-invalid-number: "§f{value} §cis not a valid number."
  kb-out-of-range: "§cOut of range §8(push 0-{max_push}, delay 0-{max_delay})§c."
  # /rank
  rank-usage: "§7Usage: §f/rank <player> [rank]"
  rank-available: "§7Ranks: §f{ranks}"
  rank-show: "§f{player} §7is §f{rank}§7."
  rank-updated: "§f{player} §7is now §f{rank}§7."
  rank-received: "§7Your rank is now §f{rank}§7."
  rank-unknown: "§cUnknown rank §f{rank}§c. Available: §f{ranks}"
  rank-too-high: "§cYou cannot hand out §f{rank}§c."
  rank-player-offline: "§f{player} §cis not online."
  # Settings menu
  settings-saved: "§aSettings saved."
  settings-empty: "§cThere is nothing to configure here."
  # Action bar read-out, shown while the player is not in combat.
  cps-counter: "§7CPS: §f{cps}"
  ffa-arena-unavailable: "§cThis arena is currently unavailable."
  not-in-lobby: "§cYou can only do that from the lobby."
  soon: "§7This feature is coming soon."

settings:
  # Menu opened by the lobby book. Sections and entries below are free-form:
  # add a section, tag settings with its id, and both appear in the menu.
  form:
    title: "§l§bSettings"
    content: "§7Pick a section"
    section-title: "§l{section}"
    toggle: "{display}
§7{description}"
  sections:
    gameplay:
      display: "§aGameplay"
      icon: "textures/ui/icon_recipe_equipment"
    visual:
      display: "§bVisual"
      icon: "textures/ui/icon_setting"
  # The ids are the ones the code reacts to - renaming one turns its feature
  # back to the default. Everything else here is free to change.
  entries:
    auto-respawn:
      section: gameplay
      display: "Auto respawn"
      description: "Jump straight back into the arena instead of the lobby"
      default: true
    hit-distance:
      section: gameplay
      display: "Hit distance"
      description: "Show the reach of every hit above the hotbar"
      default: true
    scoreboard:
      section: visual
      display: "Scoreboard"
      description: "Sidebar with online, kills and ping"
      default: true
    bossbar:
      section: visual
      display: "Boss bar"
      description: "Server bar at the top of the screen"
      default: true
    nametag:
      section: visual
      display: "Nametag"
      description: "Show your ping, device and health under your name"
      default: true
    cps-counter:
      section: visual
      display: "CPS counter"
      description: "Clicks per second above the hotbar, outside combat"
      default: false
    lightning-on-kill:
      section: visual
      display: "Kill lightning"
      description: "Lightning strike where a player dies"
      default: true

leaderboards:
  enabled: true
  # Floating boards in the lobby. "field" is the counter to rank by; "kills"
  # and "deaths" are what the core stores today.
  boards:
    kills:
      # Leave "world" out to use the lobby world.
      x: 0.5
      y: 70.0
      z: 0.5
      field: kills
      limit: 10
      title: "§l§6Top Kills§r"
      entry: "§7{position}. §f{player} §8- §b{value}"
      empty: "§8- nobody yet -"

scoreboard:
  enabled: true
  title: "§l§fAWPE"
  # Slot: sidebar / list / belowname
  slot: sidebar
  lines:
    lobby:
      - "§fOnline:"
      - "§e{online}"
      - "§6 "
      - "§fKills:"
      - "§e{kills}"
      - "§8 "
      - "§fPing:"
      - "§e{ping}ms"
    ffa:
      - "§fOnline:"
      - "§e{online}"
      - "§6 "
      - "§fKills:"
      - "§e{kills}"
      - "§8 "
      - "§fPing:"
      - "§e{ping}ms"

bossbar:
  enabled: true
  title: "§cAWPE §eBedrock"
  # red / blue / green / yellow / purple / rebecca_purple / white
  color: purple
  percentage: 1.0

nametag:
  enabled: true
  # Rendered under the player name (score tag).
  format: "§e{ping} ms §8| §e{device} §8| §e{health}/{max_health}"
  # Displayed name of every device, keyed by the protocol DeviceOS value.
  devices:
    android: "Android"
    ios: "iOS"
    osx: "macOS"
    amazon: "FireOS"
    gear_vr: "GearVR"
    hololens: "Hololens"
    windows_10: "Win10"
    win32: "Windows"
    dedicated: "Dedicated"
    tvos: "tvOS"
    playstation: "PS4"
    nintendo: "Switch"
    xbox: "Xbox"
    windows_phone: "WinPhone"
    linux: "Linux"
    unknown: "Unknown"

lobby:
  # "default" uses the world configured as level-name in server.properties.
  world: default
  # survival / creative / adventure / spectator
  gamemode: adventure
  # Freeze the lobby world at midday.
  lock-time: true
  # Teleport a player back to spawn when he falls further than this below it.
  void-level: 10
  protection:
    block-break: true
    block-place: true
    item-drop: true
    item-pickup: true
    inventory-transaction: true
    damage: true
    pvp: true
    hunger: true
    interact: true
  # Hotbar contents of the lobby. The key is the action bound to the item.
  # Available actions: ffa-selector, private-arenas, settings
  items:
    ffa-selector:
      slot: 0
      item: iron_axe
      name: "§r§bFFA"
      lore:
        - "§7Tap to pick a free-for-all mode"
    private-arenas:
      slot: 1
      item: clock
      name: "§r§6Private arenas"
      lore:
        - "§7Coming soon"
    settings:
      slot: 8
      item: book
      name: "§r§aSettings"
      lore:
        - "§7Coming soon"

ffa:
  # Game mode players are put in while fighting.
  gamemode: adventure
  # Item counted for the kill feed. Leave empty to disable pot counting.
  pot-item: strong_healing_splash_potion
  # Default knockback for every arena; each arena may override any of these.
  #   horizontal   sideways push (vanilla 0.4)
  #   vertical     upwards push  (vanilla 0.4)
  #   attack-delay ticks of damage immunity after a hit - the "tickrate" (vanilla 10)
  knockback:
    horizontal: 0.4
    vertical: 0.4
    attack-delay: 10
  # Automatically create a missing arena world instead of disabling the arena.
  auto-generate-worlds: true
  generator: flat
  form:
    title: "§l§6-- Play --"
    content: ""
    button: "{arena_display}\n§e{arena_players} playing"
  arenas:
    gapple:
      display: "§6Gapple FFA"
      world: ffa_gapple
      icon: "textures/items/apple_golden"
      kit: gapple
    nodebuff:
      display: "§cNoDebuff FFA"
      world: ffa_nodebuff
      icon: "textures/items/potion_bottle_splash_heal"
      kit: nodebuff
      knockback:
        horizontal: 0.4
        vertical: 0.4
        attack-delay: 10
    fist:
      display: "§eFist FFA"
      world: ffa_fist
      icon: "textures/items/leather"
      kit: fist
      # No potions in this mode, so the kill feed drops the counters.
      pot-item: ""
      knockback:
        horizontal: 0.35
        vertical: 0.35
        attack-delay: 8

# Kits referenced by ffa.arenas.*.kit
#   armor:   helmet / chestplate / leggings / boots
#   items:   list, optional "slot" pins an item to a hotbar slot
#   effects: name => {amplifier, duration (seconds, -1 = infinite)}
kits:
  gapple:
    armor:
      helmet:
        item: diamond_helmet
        unbreakable: true
        enchantments: {protection: 2}
      chestplate:
        item: diamond_chestplate
        unbreakable: true
        enchantments: {protection: 2}
      leggings:
        item: diamond_leggings
        unbreakable: true
        enchantments: {protection: 2}
      boots:
        item: diamond_boots
        unbreakable: true
        enchantments: {protection: 2}
    items:
      - item: diamond_sword
        slot: 0
        unbreakable: true
        enchantments: {sharpness: 1}
      - item: enchanted_golden_apple
        slot: 1
        count: 64
      - item: cooked_beef
        slot: 8
        count: 16
    effects: {}
  nodebuff:
    armor:
      helmet:
        item: diamond_helmet
        unbreakable: true
      chestplate:
        item: diamond_chestplate
        unbreakable: true
      leggings:
        item: diamond_leggings
        unbreakable: true
      boots:
        item: diamond_boots
        unbreakable: true
    items:
      - item: diamond_sword
        slot: 0
        unbreakable: true
      - item: ender_pearl
        slot: 1
        count: 16
      - item: long_swiftness_potion
        slot: 8
      - item: strong_healing_splash_potion
        count: 1
        fill: true
      #effects:
      #speed:
      #  amplifier: 0
      # duration: -1
  fist:
    armor: {}
    items: []
    effects: {}
