settings:
  # Menu opened by the lobby book. Sections and entries below are free-form:
  # add a section, tag settings with its id, and both appear in the menu.
  form:
    title: "§l§bSettings"
    content: "§7Pick a section"
    section-title: "§l{section}"
    toggle: "{display}
§7{description}"
  sections:
    gameplay:
      display: "§aGameplay"
      icon: "textures/ui/icon_recipe_equipment"
    visual:
      display: "§bVisual"
      icon: "textures/ui/icon_setting"
  # The ids are the ones the code reacts to - renaming one turns its feature
  # back to the default. Everything else here is free to change.
  entries:
    auto-respawn:
      section: gameplay
      display: "Auto respawn"
      description: "Jump straight back into the arena instead of the lobby"
      default: true
    hit-distance:
      section: gameplay
      display: "Hit distance"
      description: "Show the reach of every hit above the hotbar"
      default: true
    scoreboard:
      section: visual
      display: "Scoreboard"
      description: "Sidebar with online, kills and ping"
      default: true
    bossbar:
      section: visual
      display: "Boss bar"
      description: "Server bar at the top of the screen"
      default: true
    nametag:
      section: visual
      display: "Nametag"
      description: "Show your ping, device and health under your name"
      default: true
    cps-counter:
      section: visual
      display: "CPS counter"
      description: "Clicks per second above the hotbar, outside combat"
      default: false
    lightning-on-kill:
      section: visual
      display: "Kill lightning"
      description: "Lightning strike where a player dies"
      default: true
    kill-title:
      section: visual
      display: "Kill banner"
      description: "Big KILL! banner naming who you took down"
      default: true
    duel-requests:
      section: gameplay
      display: "Duel requests"
      description: "Let other players challenge you to a duel"
      default: true

leaderboards:
  enabled: true
  # Floating boards in the lobby. "field" is the counter to rank by; "kills"
  # and "deaths" are what the core stores today.
  boards:
    kills:
      x: 998
      y: 121
      z: 1012
      field: kills
      limit: 10
      title: "§l§6Top Kills§r"
      entry: "§7{position}. §f{player} §8- §b{value}"
      empty: "§8- nobody yet -"

scoreboard:
  enabled: true
  title: "§l§fAWPE"
  # Slot: sidebar / list / belowname
  slot: sidebar
  lines:
    lobby:
      - "§fOnline:"
      - "§e{online}"
      - "§6 "
      - "§fKills:"
      - "§e{kills}"
      - "§8 "
      - "§fPing:"
      - "§e{ping}ms"
    ffa:
      - "§fOnline:"
      - "§e{online}"
      - "§6 "
      - "§fKills:"
      - "§e{kills}"
      - "§8 "
      - "§fPing:"
      - "§e{ping}ms"
    # While waiting in a duel queue.
    queue:
      - "§fQueue:"
      - "§e{queue_ladder} §7{queue_mode}"
      - "§6 "
      - "§fWaiting:"
      - "§e{queue_time}"
      - "§8 "
      - "§fPing:"
      - "§e{ping}ms"
    duel:
      - "§fOpponent:"
      - "§e{opponent}"
      - "§6 "
      - "§fYour ping:"
      - "§e{ping}ms"
      - "§8 "
      - "§fTheir ping:"
      - "§e{opponent_ping}ms"
      - "§7 "
      - "§fDuration:"
      - "§e{duel_time}"

bossbar:
  enabled: true
  title: "§cAWPE §eBedrock"
  # red / blue / green / yellow / purple / rebecca_purple / white
  color: purple
  percentage: 1.0

nametag:
  enabled: true
  # The player's own name, above his head. {rank_color} is his rank's colour -
  # there is no rank prefix here on purpose, the colour carries the rank.
  name-format: "{rank_color}{player}"
  # Rendered under the player name (score tag).
  format: "§e{ping} ms §8| §e{device} §8| §e{health}/{max_health}"
  # Displayed name of every device, keyed by the protocol DeviceOS value.
  devices:
    android: "Android"
    ios: "iOS"
    osx: "macOS"
    amazon: "FireOS"
    gear_vr: "GearVR"
    hololens: "Hololens"
    windows_10: "Win10"
    win32: "Windows"
    dedicated: "Dedicated"
    tvos: "tvOS"
    playstation: "PS4"
    nintendo: "Switch"
    xbox: "Xbox"
    windows_phone: "WinPhone"
    linux: "Linux"
    unknown: "Unknown"

lobby:
  # "default" uses the world configured as level-name in server.properties.
  world: default
  # survival / creative / adventure / spectator
  gamemode: adventure
  # Freeze the lobby world at midday.
  lock-time: true
  # Teleport a player back to spawn when he falls further than this below it.
  void-level: 10
  protection:
    block-break: true
    block-place: true
    item-drop: true
    item-pickup: true
    inventory-transaction: true
    damage: true
    pvp: true
    hunger: true
    interact: true
  # Hotbar contents of the lobby. The key is the action bound to the item.
  # Available actions: ffa-selector, duels, settings, leave-queue
  items:
    ffa-selector:
      slot: 0
      item: iron_axe
      name: "§r§bFFA"
      lore:
        - "§7Tap to pick a free-for-all mode"
    duels:
      slot: 1
      item: clock
      name: "§r§6Duels"
      lore:
        - "§7Ranked and unranked 1v1"
    settings:
      slot: 8
      item: book
      name: "§r§aSettings"
      lore:
        - "§7Gameplay and visual options"
  # Hotbar while waiting in a duel queue.
  queue-items:
    leave-queue:
      slot: 8
      item: red_dye
      name: "§r§cLeave queue"
      lore:
        - "§7Stop searching for a match"

duels:
  # Seconds of frozen countdown before the fight.
  countdown: 5
  # Seconds a fight may last before it is called a draw. 0 = no limit.
  time-limit: 600
  # Seconds the result stays on screen before both players go back.
  end-delay: 3
  gamemode: adventure
  # Title timings in ticks for the countdown, FIGHT! and the result.
  titles:
    fade-in: 2
    stay: 18
    fade-out: 4
  invites:
    # Seconds a challenge stays open.
    timeout: 60
    # Seconds before the same player may be challenged again.
    cooldown: 10
  ranked:
    starting-elo: 1000
    # How far one match moves a rating at most.
    k-factor: 32
    # Matchmaking accepts opponents within "start" Elo, widening by "growth"
    # every "every" seconds of waiting, up to "max". Both players' windows have
    # to accept the gap, so a fresh player is never pulled into a mismatch.
    window:
      start: 50
      growth: 25
      every: 5
      max: 400
  form:
    title: "§l§6Duels"
    content: ""
    mode-button: "{mode}\n§8{queued} in queue"
    unranked-icon: "textures/items/iron_sword"
    ranked-icon: "textures/items/diamond_sword"
    ladders-title: "§l{mode}"
    ladder-button: "{ladder}\n§8{queued} queued §7| §8{playing} playing"
    challenge-title: "§lChallenge {player}"
  # Duel modes. "kit" names a block under kits. A ladder is only offered once an
  # arena lists it.
  #   ranked      false to keep a mode out of the ranked queue
  #   knockback   same keys as ffa.knockback; anything left out is inherited
  #   pot-item    counted as "pots left" in the summary; "" for none
  #   rules.no-damage    hits push but never hurt
  #   rules.fall-depth   blocks below the lower spawn that count as falling off
  ladders:
    nodebuff:
      display: "§cNoDebuff"
      icon: "textures/items/potion_bottle_splash_heal"
      kit: nodebuff
    gapple:
      display: "§6Gapple"
      icon: "textures/items/apple_golden"
      kit: gapple
      pot-item: ""
    fist:
      display: "§eFist"
      icon: "textures/items/leather"
      kit: fist
      pot-item: ""
    sumo:
      display: "§bSumo"
      icon: "textures/items/lead"
      kit: fist
      pot-item: ""
      rules:
        no-damage: true
        fall-depth: 3
  # Duel maps. "template" is a world folder under worlds/ that is COPIED for
  # every match and never played in itself - keep it out of level-name and out
  # of ffa.arenas, and stop the server before copying a new one in.
  # "spawns" are the two starting points (yaw 0 faces +Z, 180 faces -Z).
  arenas:
    # Placeholder so duels work out of the box: a flat copy of the Fist FFA
    # world. Replace it with a real map.
    flat:
      display: "Flat"
      template: duel_template_flat
      ladders: [nodebuff, gapple, fist]
      spawns:
        - {x: 256.5, y: 4, z: 246.5, yaw: 0}
        - {x: 256.5, y: 4, z: 266.5, yaw: 180}

ffa:
  # Game mode players are put in while fighting.
  gamemode: adventure
  # Item counted for the kill feed. Leave empty to disable pot counting.
  pot-item: strong_healing_splash_potion
  # Default knockback for every arena; each arena may override any of these.
  #   horizontal   sideways push (vanilla 0.4)
  #   vertical     upwards push  (vanilla 0.4)
  #   attack-delay ticks of damage immunity after a hit - the "tickrate" (vanilla 10)
  knockback:
    horizontal: 0.4
    vertical: 0.4
    attack-delay: 10
  # Automatically create a missing arena world instead of disabling the arena.
  auto-generate-worlds: true
  generator: flat
  form:
    title: "§l§6-- Play --"
    content: ""
    button: "{arena_display}\n§e{arena_players} playing"
  arenas:
    gapple:
      display: "§6Gapple FFA"
      world: ffa_gapple
      icon: "textures/items/apple_golden"
      kit: gapple
    nodebuff:
      display: "§cNoDebuff FFA"
      world: ffa_nodebuff
      icon: "textures/items/potion_bottle_splash_heal"
      kit: nodebuff
      knockback:
        horizontal: 0.4
        vertical: 0.4
        attack-delay: 10
    fist:
      display: "§eFist FFA"
      world: ffa_fist
      icon: "textures/items/leather"
      kit: fist
      # No potions in this mode, so the kill feed drops the counters.
      pot-item: ""
      knockback:
        horizontal: 0.35
        vertical: 0.35
        attack-delay: 8

# Kits referenced by ffa.arenas.*.kit
#   armor:   helmet / chestplate / leggings / boots
#   items:   list, optional "slot" pins an item to a hotbar slot
#   effects: name => {amplifier, duration (seconds, -1 = infinite)}
kits:
  gapple:
    armor:
      helmet:
        item: diamond_helmet
        unbreakable: true
        enchantments: {protection: 2}
      chestplate:
        item: diamond_chestplate
        unbreakable: true
        enchantments: {protection: 2}
      leggings:
        item: diamond_leggings
        unbreakable: true
        enchantments: {protection: 2}
      boots:
        item: diamond_boots
        unbreakable: true
        enchantments: {protection: 2}
    items:
      - item: diamond_sword
        slot: 0
        unbreakable: true
        enchantments: {sharpness: 1}
      - item: enchanted_golden_apple
        slot: 1
        count: 64
      - item: cooked_beef
        slot: 8
        count: 16
    effects: {}
  nodebuff:
    armor:
      helmet:
        item: diamond_helmet
        unbreakable: true
      chestplate:
        item: diamond_chestplate
        unbreakable: true
      leggings:
        item: diamond_leggings
        unbreakable: true
      boots:
        item: diamond_boots
        unbreakable: true
    items:
      - item: diamond_sword
        slot: 0
        unbreakable: true
      - item: ender_pearl
        slot: 1
        count: 16
      - item: strong_healing_splash_potion
        count: 1
        fill: true
    # Permanent speed rather than a swiftness potion: nothing to drink mid-fight,
    # and the slot the potion took is filled with one more healing pot.
    effects:
      speed:
        amplifier: 0
        duration: -1
  fist:
    armor: {}
    items: []
    effects: {}
